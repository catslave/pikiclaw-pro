                          - code [ref=e15238]: "1. Patient calls clinic 2. Existing IVAR live voice session starts 3. Existing assistant handles appointment workflow 4. Conversation summary / appointment info remains in existing flow 5. Optional MVP: page shows appointment record from mock/patient_records"
