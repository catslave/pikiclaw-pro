                          - code [ref=e15228]: 1. Doctor opens Assistant Builder Page 2. Page creates text NCA session via IVAR TextTaskService 3. Doctor says follow-up rules 4. NCA compiles BackgroundPlanSpec 5. NCA calls create_background_plan tool 6. agent-service validates spec 7. agent-service calls Goal Runtime /plans API 8. Goal Runtime persists goal_plans 9. Builder page shows generated plan and summary
