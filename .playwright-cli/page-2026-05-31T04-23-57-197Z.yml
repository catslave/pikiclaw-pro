                          - code [ref=e3865]: "1. Doctor opens Conversational Builder 2. AUI creates builder session 3. Doctor says: \"患者第一次拔牙后三天回访，两周后二次回访...\" 4. NCA asks clarifying questions: - 用电话还是短信？ - 未接听重试几次？ - 转人工是生成待办还是转接前台？ 5. Doctor confirms 6. NCA generates: - assistant basic config draft - BackgroundPlanSpec 7. NCA calls create_background_plan tool or AUI calls create plan API 8. AUI creates assistant using existing assistant/skill APIs 9. Plan is attached to assistant 10. AUI navigates to new assistant detail page"
