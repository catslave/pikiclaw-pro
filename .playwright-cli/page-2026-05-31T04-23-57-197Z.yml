                            - button [ref=e3144] [cursor=pointer]:
                              - img [ref=e3145]
                          - code [ref=e3149]: "1. IVAR returns action result: no_answer 2. Goal Runtime reads retry policy 3. If attempt < maxAttempts: status = waiting_retry wake_at = now + retry_interval 4. Else: status = escalated writes manual follow-up record 5. Doctor Patient Page displays failed follow-up and manual handoff"
