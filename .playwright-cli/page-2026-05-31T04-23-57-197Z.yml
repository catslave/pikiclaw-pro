                          - generic [ref=e3111]:
                            - generic [ref=e3112]: text
                            - button [ref=e3113] [cursor=pointer]:
                              - img [ref=e3114]
                          - code [ref=e3118]: "1. Patient calls clinic 2. Existing IVAR live voice session starts 3. Existing assistant handles appointment workflow 4. Conversation summary / appointment info remains in existing flow 5. Optional MVP: page shows appointment record from mock/patient_records"
                        - paragraph [ref=e3119]: 这里不需要为了 demo 重写预约能力。预约服务继续由现有 assistant 提供。
                        - heading "7.3 医生标记拔牙完成" [level=4] [ref=e3120]
                        - generic [ref=e3121]:
                          - generic [ref=e3122]:
                            - generic [ref=e3123]: text
                            - button [ref=e3124] [cursor=pointer]:
                              - img [ref=e3125]
                          - code [ref=e3129]: "1. Doctor marks patient extraction completed in Patient Page 2. Page POST /v1/domain-events: eventType = procedure.completed payload.procedureType = extraction payload.completedAt = ... 3. Goal Runtime loads active plans for assistant 4. PlanMaterializer matches rules 5. Creates two goal_runs: - completedAt + 3 days - completedAt + 14 days 6. Writes patient_records: procedure completed"
                        - heading "7.4 到点后台回访" [level=4] [ref=e3130]
                        - generic [ref=e3131]:
                          - generic [ref=e3132]:
                            - generic [ref=e3133]: text
                            - button [ref=e3134] [cursor=pointer]:
                              - img [ref=e3135]
                          - code [ref=e3139]: "1. GoalScheduler finds due goal_runs 2. Marks run running and increments attempt 3. Opens short NCA text session 4. Injects objective + patient context + previous record 5. NCA returns call script / action intent 6. Goal Runtime dispatches voice action through IVAR 7. Closes NCA session 8. Writes timeline: fired, nca_step, voice_dispatched"
                        - heading "7.5 回访失败重试 / 转人工" [level=4] [ref=e3140]
                        - generic [ref=e3141]:
