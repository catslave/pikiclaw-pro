                        - heading "4. 规则确认与 PlanSpec 生效边界" [level=3] [ref=e3896]
                        - heading "4.1 为什么必须确认" [level=4] [ref=e3897]
                        - paragraph [ref=e3898]: 医生自然语言会有歧义，例如：
                        - list [ref=e3899]:
