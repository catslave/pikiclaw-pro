                  - generic [ref=e1698]: "[Context bundle above was attached by Pikiclaw once at session creation. Your next user message follows.] 我想到了一个场景，是否这可以这样： 1、我们会提供一个小窗口或者以一个页面给医生，医生在页面上点击创建assistant，会以chat的方式跟医生聊。 2、医生说了规则，在用户第一次拔牙后，三天后要回访；两周后二次回访；如果回访无法接听，间隔3天后重试；如果还是没接听，记录回访失败转人工。 3、说话之后，这个assistant就创建了，就能为用户提供服务。当用户拨打电话预约，这个assistant能提供服务（或者用现有的assistant提供服务，这个assistant只是background被触发）。 4、医生标记用户拔牙后，这个assistant自动为该用户生成回访记录。到达时间会回访用户，并回访结果。 5、用户预约，assistant也会记录下用户的画像，以及每次的记录。我们可以提供一个单独的page给医生使用，创建assistant和查看用户记录。 基于这样的场景，来做呢"
