                          - listitem [ref=e3906]:
                            - generic [ref=e3908]: “转人工”是创建 task，还是立即外呼前台？
                        - paragraph [ref=e3909]: 因此 PlanSpec 应有状态：
                        - generic [ref=e3910]:
                          - generic [ref=e3911]:
