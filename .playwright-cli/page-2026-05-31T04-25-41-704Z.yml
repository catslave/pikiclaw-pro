                        - code [ref=e7187]: "1. Doctor marks patient extraction completed in Patient Page 2. Page POST /v1/domain-events: eventType = procedure.completed payload.procedureType = extraction payload.completedAt = ... 3. Goal Runtime loads active plans for assistant 4. PlanMaterializer matches rules 5. Creates two goal_runs: - completedAt + 3 days - completedAt + 14 days 6. Writes patient_records: procedure completed"
