                        - code [ref=e9274]: "1. Doctor/Admin 在 AUI Builder 中创建 assistant 2. NCA 生成 extraction follow-up BackgroundPlanSpec 3. agent-service create_background_plan 保存 plan 4. AUI Patient Timeline 点击 \"Mark extraction completed\" 5. AUI POST /v1/background-events eventType = procedure.completed source = demo 6. Goal Runtime 保存 background_event 7. PlanMaterializer 匹配 active plan: - extraction-day3 - extraction-week2 8. 创建两个 goal_runs 9. AUI 展示两个 scheduled follow-up 10. Demo 点击 run-now 或时间推进 11. GoalRunService 打开 NCA text session，注入 objective/context 12. NCA 生成回访话术 13. Goal Runtime dispatch voice action 14. Demo mock no_answer 15. 若 week2 run 且 attempt < 2，则 wake_at = now + P3D 16. 第二次 no_answer 后 escalated 17. AUI timeline 展示 procedure -> follow-up -> retry -> manual handoff"
