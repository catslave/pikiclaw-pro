                        - code [ref=e7197]: "1. GoalScheduler finds due goal_runs 2. Marks run running and increments attempt 3. Opens short NCA text session 4. Injects objective + patient context + previous record 5. NCA returns call script / action intent 6. Goal Runtime dispatches voice action through IVAR 7. Closes NCA session 8. Writes timeline: fired, nca_step, voice_dispatched"
