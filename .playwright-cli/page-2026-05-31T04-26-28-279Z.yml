                            - generic [ref=e11249]: text
                            - button [ref=e11250] [cursor=pointer]:
                              - img [ref=e11251]
                          - code [ref=e11255]: 1. Doctor opens Assistant Builder Page 2. Page creates text NCA session via IVAR TextTaskService 3. Doctor says follow-up rules 4. NCA compiles BackgroundPlanSpec 5. NCA calls create_background_plan tool 6. agent-service validates spec 7. agent-service calls Goal Runtime /plans API 8. Goal Runtime persists goal_plans 9. Builder page shows generated plan and summary
                        - heading "7.2 患者来电预约" [level=4] [ref=e11256]
                        - generic [ref=e11257]:
                          - generic [ref=e11258]:
                            - generic [ref=e11259]: text
                            - button [ref=e11260] [cursor=pointer]:
                              - img [ref=e11261]
                          - code [ref=e11265]: "1. Patient calls clinic 2. Existing IVAR live voice session starts 3. Existing assistant handles appointment workflow 4. Conversation summary / appointment info remains in existing flow 5. Optional MVP: page shows appointment record from mock/patient_records"
                        - paragraph [ref=e11266]: 这里不需要为了 demo 重写预约能力。预约服务继续由现有 assistant 提供。
                        - heading "7.3 医生标记拔牙完成" [level=4] [ref=e11267]
                        - generic [ref=e11268]:
                          - generic [ref=e11269]:
                            - generic [ref=e11270]: text
                            - button [ref=e11271] [cursor=pointer]:
                              - img [ref=e11272]
                          - code [ref=e11276]: "1. Doctor marks patient extraction completed in Patient Page 2. Page POST /v1/domain-events: eventType = procedure.completed payload.procedureType = extraction payload.completedAt = ... 3. Goal Runtime loads active plans for assistant 4. PlanMaterializer matches rules 5. Creates two goal_runs: - completedAt + 3 days - completedAt + 14 days 6. Writes patient_records: procedure completed"
                        - heading "7.4 到点后台回访" [level=4] [ref=e11277]
                        - generic [ref=e11278]:
                          - generic [ref=e11279]:
                            - generic [ref=e11280]: text
                            - button [ref=e11281] [cursor=pointer]:
                              - img [ref=e11282]
                          - code [ref=e11286]: "1. GoalScheduler finds due goal_runs 2. Marks run running and increments attempt 3. Opens short NCA text session 4. Injects objective + patient context + previous record 5. NCA returns call script / action intent 6. Goal Runtime dispatches voice action through IVAR 7. Closes NCA session 8. Writes timeline: fired, nca_step, voice_dispatched"
                        - heading "7.5 回访失败重试 / 转人工" [level=4] [ref=e11287]
                        - generic [ref=e11288]:
                          - generic [ref=e11289]:
                            - generic [ref=e11290]: text
                            - button [ref=e11291] [cursor=pointer]:
                              - img [ref=e11292]
                          - code [ref=e11296]: "1. IVAR returns action result: no_answer 2. Goal Runtime reads retry policy 3. If attempt < maxAttempts: status = waiting_retry wake_at = now + retry_interval 4. Else: status = escalated writes manual follow-up record 5. Doctor Patient Page displays failed follow-up and manual handoff"
