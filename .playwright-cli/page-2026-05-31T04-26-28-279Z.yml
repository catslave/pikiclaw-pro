                        - paragraph [ref=e10808]: 本 demo 想展示一个新的能力：
                        - blockquote [ref=e10809]:
                          - paragraph [ref=e10810]: 医生通过 chat 创建或配置一个 assistant，并告诉它后台回访计划。之后当患者发生业务事件，例如拔牙完成，系统会自动生成未来回访任务；到达时间后，assistant 在后台触发回访、记录结果、失败后重试并最终转人工。
                        - paragraph [ref=e10811]: 核心变化不是“再做一个牙医 workflow”，而是：
                        - blockquote [ref=e10812]:
                          - paragraph [ref=e10813]:
                            - text: 给现有 assistant 增加
                            - strong [ref=e10814]: Background Plans
                            - text: 能力，让 assistant 不只在用户来电时服务，也可以被业务事件和计划目标触发。
