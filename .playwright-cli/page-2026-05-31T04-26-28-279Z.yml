                - generic [ref=e3556]:
                  - generic [ref=e3558]: 下一个问题是关于产品流程和系统集成边界：我想到的技术方案是，我们会在 AUI 界面，也就是现有 AIR 前端工程里新增一个页面，用于给医生或者 admin 创建这样的 assistant。这个 assistant 的创建方式与现有 AIR 的步骤流程不一样，它是以对话方式完成创建，甚至可以通过语音方式完成。在创建过程中，assistant 会与医生确认规则；一旦确认清楚，这个 assistant 就被创建。 当这个 assistant/system 被创建后，比如用户打电话进来预约，它会根据规则或提示词去问用户是否需要来电提醒。如果用户回答 yes，那么它会记录下这一条规则。 但我没想好的是：这些内容应该在哪里体现？普通规则记录可以在 AIR 的 AI 界面上展示，但这里是否也应该与医生内置的业务系统进行关联？否则系统无法知道哪些用户已经完成手术。否则就只能让 admin 或每个医生再回到 AIR 系统里说某某用户已经完成手术。 请基于现有 AIR 工程继续分析：AUI 新页面、对话式/语音式 assistant 创建、规则确认、预约提醒记录、术后完成事件来源、医生业务系统集成这几块应该如何设计；哪些是 MVP 可以做的，哪些需要外部系统集成；如果没有医生系统集成，demo 应该如何模拟这个事件闭环。
