                          - listitem [ref=e10796]:
                            - generic [ref=e10798]: IVAR / channel runtime 创建 session；
                          - listitem [ref=e10799]:
                            - generic [ref=e10801]: NCA 在该 session 内提供 LLM/Agent 能力；
                          - listitem [ref=e10802]:
